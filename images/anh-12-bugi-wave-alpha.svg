<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t12 d12">
<title id="t12">Bugi Honda Wave Alpha 110 (2020): mã CPR6EA-9S, khe hở 0,8–0,9 mm</title>
<desc id="d12">Bugi chuẩn của Honda Wave Alpha 110 đời 2020 là CPR6EA-9S của NGK, hoặc U20EPR9S của DENSO, với khe hở bugi 0,8 đến 0,9 mm, đo bằng thước lá loại dây. Đây là khe hở bugi, sách không ghi trị số khe hở van.</desc>
<rect x="10" y="10" width="780" height="400" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">BUGI WAVE ALPHA 110 (2020)</text>
<text x="400" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Mã bugi và khe hở chuẩn — theo sách Honda, Service Data trang 106</text>
<g font-family="sans-serif" fill="#222222">
<rect x="60" y="105" width="680" height="80" fill="#d9e8f7" stroke="#2a5a8a" stroke-width="2"/>
<text x="400" y="140" text-anchor="middle" font-size="22" font-weight="bold">Mã bugi chuẩn: CPR6EA-9S (NGK)</text>
<text x="400" y="168" text-anchor="middle" font-size="17" fill="#555555">hoặc U20EPR9S (DENSO)</text>
<rect x="60" y="205" width="680" height="80" fill="#fff2cc" stroke="#b38f00" stroke-width="2"/>
<text x="400" y="240" text-anchor="middle" font-size="22" font-weight="bold">Khe hở bugi: 0,8–0,9 mm</text>
<text x="400" y="268" text-anchor="middle" font-size="17" fill="#555555">Đo bằng thước lá loại dây</text>
<text x="400" y="322" text-anchor="middle" font-size="18" font-weight="bold" fill="#b30000">Đây là khe hở bugi — sách không ghi trị số khe hở van.</text>
<text x="400" y="352" text-anchor="middle" font-size="16" fill="#555555">Đừng lấy mã bugi của xe này lắp sang xe khác.</text>
</g>
<text x="400" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777777">Sơ đồ được vẽ riêng cho website — không dùng ảnh mạng</text>
</svg>
