<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t4 d4">
<title id="t4">Sơ đồ xe máy với các vùng không được xịt nước trực tiếp</title>
<desc id="d4">Sơ đồ xe máy nhìn từ bên, đánh dấu X đỏ tại sáu vùng không được xịt nước trực tiếp khi rửa xe: lọc gió, ống xả, giắc nối điện, mặt đồng hồ, ổ khóa và cổng sạc, khoang dưới yên xe tay ga.</desc>
<rect x="10" y="10" width="780" height="400" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">KHÔNG XỊT NƯỚC TRỰC TIẾP VÀO CÁC VÙNG NÀY</text>
<g stroke="#333333" stroke-width="3" fill="none">
<circle cx="200" cy="300" r="55"/><circle cx="600" cy="300" r="55"/>
<path d="M 200 300 L 320 180 L 480 180 L 600 300"/>
<path d="M 320 180 L 280 120 L 360 120"/>
<path d="M 480 180 L 520 260 L 430 260"/>
</g>
<g font-family="sans-serif" font-size="18" font-weight="bold" fill="#b30000" text-anchor="middle">
<text x="340" y="110">✕ Mặt đồng hồ</text>
<text x="340" y="160">✕ Ổ khóa</text>
<text x="520" y="110">✕ Lọc gió</text>
<text x="520" y="240">✕ Khoang dưới yên</text>
<text x="660" y="240">✕ Ống xả</text>
<text x="200" y="220">✕ Giắc điện</text>
</g>
<text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Không chắc chỗ nào chịu được nước thì lau bằng khăn ướt, đừng xịt thẳng vào.</text>
</svg>
